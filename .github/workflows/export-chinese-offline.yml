name: Export Chinese offline HTML gallery
on:
  push:
    paths:
      - .github/workflows/export-chinese-offline.yml
      - scripts/export-offline-gallery.py
      - scripts/tests/touch-gestures.cjs
      - models/**
      - shared/**
      - catalog.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install module bundler
        run: npm install --no-save --no-audit --no-fund esbuild@0.25.12
      - name: Validate unified touch gestures
        run: node scripts/tests/touch-gestures.cjs
      - name: Export catalog to single-file HTML pages
        id: build
        continue-on-error: true
        run: python scripts/export-offline-gallery.py | tee /tmp/offline-export.log
      - name: Basic output check
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: test -f '_offline-output/3Dmodel2-中文离线案例/导出检查报告.json'
      - name: Upload self-contained HTML gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3Dmodel2-Chinese-Offline-HTML
          path: _offline-output/3Dmodel2-中文离线案例/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
