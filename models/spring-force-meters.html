function createScaleGeometry(project){
  const vertices = [], indices = [];

  const pointerY = cylindrical ? 116 : 100 + state.force / spec.max * 400;
  const detailBox = cylindrical ? [32,79,156,138] : [17,Math.max(75,Math.min(438,pointerY - 57)),186,122];
  const [x,y,width,height] = detailBox;
  $('#readingTitle').textContent = cylindrical ? '固定下沿刻度 · 局部放大' : '指针附近刻度 · 局部放大';
  $('#readType').textContent = `${spec.name} · ${spec.max} N 量程 · 每小格 ${spec.div} N`;
  readSVG.setAttribute('viewBox',detailBox.join(' '));
  readSVG.innerHTML = `<defs><clipPath id="reading-crop"><rect x="${x}" y="${y}" width="${width}" height="${height}"/></clipPath></defs>
    <g clip-path="url(#reading-crop)">${svgMarkup(k,pointerY)}</g>`;
}
function setReadingVisible(visible){
  readingPane.hidden = !visible;
  readButton.classList.toggle('active',visible);
  readButton.setAttribute('aria-expanded', String(visible));
  drawSVG();
}
$('#meters').onclick=e=>{const b=e.target.closest('[data-meter]');if(b)selectMeter(b.dataset.meter);};$('#modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode);};$('#force').oninput=e=>{state.play=false;$('#play').textContent='连续加载';setForce(+e.target.value);};$('#presets').onclick=e=>{const b=e.target.closest('[data-f]');if(b){state.play=false;$('#play').textContent='连续加载';setForce(+b.dataset.f);}};$('#reset').onclick=()=>{state.play=false;$('#play').textContent='连续加载';setForce(0);};$('#play').onclick=()=>{state.play=!state.play;state.t0=performance.now();$('#play').textContent=state.play?'暂停演示':'连续加载';};$('#angles').onclick=e=>{const b=e.target.closest('[data-angle]');if(!b)return;state.angle=b.dataset.angle;focus(state.angle);document.querySelectorAll('[data-angle]').forEach(x=>x.classList.toggle('active',x===b));};$('#fit').onclick=()=>{manualView=false;focus(state.angle);};readButton.onclick=()=>setReadingVisible(readingPane.hidden);$('#close').onclick=()=>{setReadingVisible(false);readButton.focus();};$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('.stage').requestFullscreen();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!readingPane.hidden&&!document.fullscreenElement){const restoreFocus=readingPane.contains(document.activeElement);setReadingVisible(false);if(restoreFocus)readButton.focus();}});
let pointers=new Map(),drag=null;canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{manualView=true;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,pan:Navigation3D.isPan(e)};};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>1){const pts=[...pointers.values()];const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(drag.dist)orbit.d=Math.max(50,Math.min(1400,orbit.d*drag.dist/dist));drag.dist=dist;}if(drag.pan||pointers.size>1){Navigation3D.pan(camera,orbit.target,canvas,dx/(pointers.size>1?2:1),dy/(pointers.size>1?2:1));}else{orbit.yaw-=dx*.007;orbit.pitch=Math.max(-1.45,Math.min(1.45,orbit.pitch+dy*.005));}camUpdate();};canvas.onpointerup=canvas.onpointercancel=e=>{pointers.delete(e.pointerId);if(!pointers.size)drag=null;};canvas.onwheel=e=>{manualView=true;e.preventDefault();orbit.d=Math.max(40,Math.min(1600,orbit.d*Math.exp(e.deltaY*.001)));camUpdate();};canvas.ondblclick=()=>focus('front');
let frameId=0,last=0;function loop(t){frameId=requestAnimationFrame(loop);if(state.play&&t-last>40){last=t;const max=state.selected==='all'?5:specs[state.selected].max,ph=((t-state.t0)/1000)%10;setForce(max*(ph<4?(1-Math.cos(ph/4*Math.PI))/2:ph<5?1:ph<9?(1+Math.cos((ph-5)/4*Math.PI))/2:0));}renderer.render(scene,camera);}setReadingVisible(matchMedia('(min-width: 1200px)').matches);resize();selectMeter('all');setMode('closed');frameId=requestAnimationFrame(loop);window.addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);resizeObserver.disconnect();scene.traverse(o=>{if(o.isMesh)o.geometry.dispose();});renderer.dispose();renderer.forceContextLoss();},{once:true});
window.lab={state,models,setForce,selectMeter,setMode,focus,scene,renderer,camera,orbit,check(){return Object.fromEntries(Object.entries(models).map(([k,o])=>[k,{force:state.force,travel:-o.moving.position.y,pointerY:55+o.moving.position.y,springBottom:58-135*state.force/o.max,visible:o.root.visible}]))}};
